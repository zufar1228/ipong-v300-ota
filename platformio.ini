[env:esp32doit-devkit-v1]
; Versi dikunci agar build OTA berikutnya identik perilakunya dengan build pertama.
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Partisi app 2 x 1.9MB (default hanya 2 x 1.25MB). Partisi TIDAK bisa diubah lewat OTA,
; jadi harus sudah benar saat flash USB pertama.
board_build.partitions = min_spiffs.csv
lib_deps =
    esp32async/ESPAsyncWebServer @ 3.12.1
    esp32async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.2
