name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is missing"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          TAG="android-v$VER"
          APK="iPong-V300-$VER.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Aplikasi Android iPong V300 v$VER" \
              --notes "Unduh $APK, buka di HP Android, lalu izinkan pemasangan dari sumber ini. Aplikasi membuka panel kontrol robot (192.168.4.1) dan memaksa koneksi melalui WiFi robot."
          fi
          gh release upload "$TAG" "$APK" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: ipong-apk
          path: android/app/build/outputs/apk/release/app-release.apk
